name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Reject user-facing veteran copy
        run: node frontend/scripts/check-honoree-copy.mjs

      - name: Check the shared version
        run: node --test frontend/scripts/check-version.mjs

      - name: Check mapped phone and organization claims
        run: node --test frontend/scripts/check-entra-claims.mjs

      - name: Check US phone formats
        run: node --test frontend/scripts/check-us-phone.mjs

      - name: Check administrator tab errors
        run: node --test frontend/scripts/check-admin-access.mjs

      - name: Check profile load and public requests
        run: node --test frontend/scripts/check-profile-load.mjs

      - name: Check thumbnail blob url lifetime
        run: node --test frontend/scripts/check-blob-url.mjs

      - name: Check submission display
        run: node --test frontend/scripts/check-submission-display.mjs

      - name: Check Print Center viewer
        run: node --test frontend/scripts/check-print-center.mjs

      - name: Check network retry
        run: node --test frontend/scripts/check-token-retry.mjs

      - name: Check submit photo preparation
        run: node --test frontend/scripts/check-submit-photo.mjs

      - name: Typecheck frontend
        working-directory: frontend
        run: |
          npm install
          npx tsc --noEmit

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install honoree card fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Test API
        run: dotnet test backend/PFOH.Api.Tests/PFOH.Api.Tests.csproj --configuration Release
